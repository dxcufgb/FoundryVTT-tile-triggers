# Builds module.zip and attaches it (with module.json) to a GitHub release.
# Create a release with a tag like v1.0.0 and this runs automatically.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
             --arg d "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Zip module
        run: zip -r module.zip module.json LICENSE README.md CHANGELOG.md scripts styles templates lang

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
